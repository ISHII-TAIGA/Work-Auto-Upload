<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub 自動アップロード</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>GitHub 自動アップロード</h1>

  <label for = "repoUrl">リポジトリURL：</label>
  <input type="text" id="repoUrl" placeholder="https://github.com/USER/REPO">
  <br><br>

  <label for = "token">GitHub Token：</label>
  <input type="password" id="token" placeholder="GitHub Personal Access Token" autocomplete = "off">

  <br><br><br>

  <!-- 本物の選択欄(画面には出さない) -->
  <input type = "file" id="fileInput" multiple hidden>
  <input type="file" id="folderInput" webkitdirectory hidden>
  <br>

  <!-- 見える方のボタン -->
  <button id="pickFilesBtn" class="pick" type="button">ファイルを選択</button>
  <button id="pickFolderBtn" class="pick" type="button">フォルダを選択</button>
  <br>

  <p id = "fileCount"></p>
  <p id = "duplicateWarning" class = "warning"></p>
  <ul id = "fileList"></ul>

  <button id = "clearBtn" class = "secondary" type = "button">選択を解除</button>
  
  <button id="uploadBtn">アップロード</button>

  <div id="result"></div>
  <ul id = "uploadedList"></ul>

  <script src="config.js"></script>
  <script src="element.js"></script>
  <script src="utils.js"></script>
  <script src="github.js"></script>
  <script src="targets.js"></script>
  <script src="ui.js"></script>
  <script src="main.js"></script>
</body>
</html>
